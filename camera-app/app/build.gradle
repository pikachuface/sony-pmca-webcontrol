apply plugin: 'com.android.application'

android {
    compileSdkVersion 10
    buildToolsVersion "25.0.2"

    defaultConfig {
        applicationId "io.github.pikachuface.webcontrol"
        minSdkVersion 10
        targetSdkVersion 10
        versionCode 1
        versionName "1.0.0"
    }

    // One committed debug key for every build machine and CI run. A camera keeps the
    // signature of the installed app, so a per-machine random key would make updates
    // from different builders incompatible. This key protects nothing; do not reuse it.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_6
        targetCompatibility JavaVersion.VERSION_1_6
    }

    aaptOptions {
        noCompress 'gzip'
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def apkName = "sony-pmca-webcontrol-${output.baseName}-${variant.versionName}.apk"
        output.outputFile = new File(output.outputFile.parent, apkName)
    }
}

dependencies {
    provided 'com.github.ma1co.OpenMemories-Framework:stubs:-SNAPSHOT'
    compile 'com.github.ma1co.OpenMemories-Framework:framework:-SNAPSHOT'
    compile 'com.nanohttpd:nanohttpd:2.1.1'
    // Debug console (DebugServer): Java-syntax scripting on the camera. Apache 2.0, Java 5 bytecode.
    compile 'org.apache-extras.beanshell:bsh:2.0b6'
}

task buildCameraWebUi(type: Exec) {
    def webClientDir = file('../../web-client')
    inputs.dir new File(webClientDir, 'src')
    inputs.file new File(webClientDir, 'index.html')
    inputs.file new File(webClientDir, 'package.json')
    inputs.file new File(webClientDir, 'package-lock.json')
    inputs.file new File(webClientDir, 'tsconfig.json')
    inputs.file new File(webClientDir, 'vite.config.ts')
    outputs.file file('src/main/assets/index.html.gzip')

    workingDir webClientDir
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine 'cmd', '/c', 'if not exist node_modules (npm ci && npm run build:camera) else (npm run build:camera)'
    } else {
        commandLine 'sh', '-c', 'if [ ! -d node_modules ]; then npm ci; fi && npm run build:camera'
    }
}

preBuild.dependsOn buildCameraWebUi
